services:
  webservice:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    env_file:
      - .env
    depends_on:
      - redis
      - mysql
    read_only: true
    cap_drop:
      - ALL
    user: "1000:1000"  # matches non-root user ID

  redis:
    image: redis:latest
    container_name: redis-container
    ports:
      - "6379:6379"

  mysql:
    image: mysql:latest
    container_name: mysql-container
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
    - ./mysql-init:/docker-entrypoint-initdb.d
